[package]
name = "pdf-parser"
version = "0.1.0"
description = "A local-first PDF to Markdown desktop app"
authors = ["Alberto Benatti"]
edition = "2021"

[lib]
name = "pdf_parser_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
